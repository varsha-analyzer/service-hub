<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Categories | Service Hub Directory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% include '_navbar.html' %}

<header class="hero" style="padding:60px 60px 80px;">
  <div class="hero-inner">
    <span class="hero-eyebrow">Service Categories</span>
    <h1 style="font-size:36px;">All services available on Service Hub</h1>
    <p class="lead">Choose a category below to view verified professionals and send a service request.</p>
  </div>
</header>

<section class="section alt">
  <div class="category-grid">
    {% for cat in categories %}
    <a href="{{ url_for('category_page', name=cat.slug) }}" class="category-card" style="color:inherit;">
      <div class="icon">{{ cat.icon }}</div>
      <h4>{{ cat.name }}</h4>
      <p>{{ cat.desc }}</p>
    </a>
    {% endfor %}
  </div>
</section>

{% include '_footer.html' %}
</body>
</html>
