<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Users | Service Hub Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>

        body{
            background:#f4f6f9;
        }


        /* Sidebar */

        .sidebar{
            position:fixed;
            width:250px;
            height:100vh;
            background:#212529;
            padding-top:20px;
        }


        .sidebar h3{
            color:white;
            text-align:center;
            margin-bottom:30px;
        }


        .sidebar a{
            display:block;
            color:white;
            padding:15px 20px;
            text-decoration:none;
        }


        .sidebar a:hover{
            background:#0d6efd;
        }



        /* Content */

        .content{

            margin-left:260px;
            padding:30px;

        }


        .table-container{

            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);

        }


        .title{

            font-weight:bold;
            margin-bottom:25px;

        }


    </style>


</head>


<body>


<!-- Sidebar -->

<div class="sidebar">


    <h3>Service Hub</h3>


    <a href="{{ url_for('admin_dashboard') }}">
        📊 Dashboard
    </a>


    <a href="{{ url_for('manage_users') }}">
        👥 Manage Users
    </a>


    <a href="{{ url_for('manage_providers') }}">
        🛠 Manage Providers
    </a>


    <a href="{{ url_for('manage_categories') }}">
        📂 Manage Categories
    </a>


    <a href="{{ url_for('manage_requests') }}">
        📋 Manage Requests
    </a>


    <a href="{{ url_for('admin_logout') }}">
        🚪 Logout
    </a>


</div>





<!-- Main Content -->


<div class="content">


    <h2 class="title">
        👥 Manage Users
    </h2>



    <div class="table-container">


        <table class="table table-bordered table-hover">


            <thead class="table-dark">


                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Phone</th>

                    <th>Action</th>

                </tr>


            </thead>



            <tbody>


            {% for user in users %}


                <tr>


                    <td>
                        {{ user.id }}
                    </td>


                    <td>
                        {{ user.name }}
                    </td>


                    <td>
                        {{ user.email }}
                    </td>


                    <td>
                        {{ user.phone }}
                    </td>


                    <td>


                        <a href="{{ url_for('delete_user', id=user.id) }}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this user?')">


                            Delete


                        </a>


                    </td>


                </tr>


            {% endfor %}


            </tbody>


        </table>


    </div>



</div>



</body>

</html>
