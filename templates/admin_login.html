<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Service Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:420px;
            border:none;
            border-radius:15px;
            box-shadow:0px 8px 20px rgba(0,0,0,.15);
        }

        .card-header{
            background:#0d6efd;
            color:white;
            text-align:center;
            font-size:28px;
            font-weight:bold;
            padding:20px;
        }

        .btn-login{
            width:100%;
        }

        .logo{
            font-size:60px;
            text-align:center;
            margin-top:15px;
        }
    </style>

</head>

<body>

<div class="card login-card">

    <div class="card-header">
        Service Hub
        <br>
        Admin Login
    </div>

    <div class="card-body">

        <div class="logo">
            👨‍💼
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}

            {% for category,message in messages %}

                <div class="alert alert-danger mt-3">
                    {{message}}
                </div>

            {% endfor %}

        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                        type="text"
                        name="username"
                        class="form-control"
                        required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

            </div>

            <button class="btn btn-primary btn-login">
                Login
            </button>
        </form>
    </div>
</div>
</body>
</html>
